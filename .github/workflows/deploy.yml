name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Note : GitHub Pages doit être activé une fois à la main
      # (Settings -> Pages -> Source : GitHub Actions). Le workflow ne peut pas
      # le faire lui-même : le jeton d'action n'a pas les droits d'administration
      # du dépôt, et `configure-pages` échouait à cette étape.

      # `site` et `base` sont deduits de GITHUB_REPOSITORY par astro.config.mjs :
      # rien a configurer, que le depot soit un site utilisateur ou un projet.
      # `sources/` n'est pas versionné (npm run fetch:assets le récupère) :
      # en CI on valide les données déjà générées, pas la régénération.
      - name: Type check
        run: npm run check

      - name: Validate data
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
